name: Release

# Publishing a GitHub release builds both binaries for every platform, plus a macOS
# app (a universal CloudDirStat.app in a DMG), and attaches them to that release. Run it by hand to rebuild an existing release's assets
# (give its tag), or to test the build without a release (leave the tag empty).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach to (empty = build only)"
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: aarch64-apple-darwin, os: macos-latest }
          # Built on an older Ubuntu so the binaries also run on older glibc versions.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG || github.ref }}
          # Full history and tags, so the version comes from the release tag.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          target="${{ matrix.target }}"
          name="clouddirstat-${TAG:-dev}-$target"
          ext=""
          if [[ "$target" == *windows* ]]; then ext=".exe"; fi

          mkdir -p "dist/$name"
          cp "target/$target/release/clouddirstat$ext" \
             "target/$target/release/clouddirstat-gui$ext" \
             README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"

          cd dist
          if [[ "$ext" == ".exe" ]]; then
            archive="$name.zip"
            pwsh -NoProfile -Command "Compress-Archive -Path '$name' -DestinationPath '$archive'"
          else
            archive="$name.tar.gz"
            tar -czf "$archive" "$name"
          fi
          rm -rf "$name"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

      # The macos-app job joins the two Mac builds of the GUI into one app.
      - if: contains(matrix.target, 'apple-darwin')
        uses: actions/upload-artifact@v7
        with:
          name: gui-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/clouddirstat-gui
          if-no-files-found: error

  macos-app:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG || github.ref }}
      - uses: actions/download-artifact@v8
        with:
          name: gui-aarch64-apple-darwin
          path: gui/arm64
      - uses: actions/download-artifact@v8
        with:
          name: gui-x86_64-apple-darwin
          path: gui/x86_64
      - name: Build the app and DMG
        run: |
          # The app's version is the tag without its "v", or Cargo's for test builds.
          version="${TAG#v}"
          if [[ -z "$version" ]]; then
            version="$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)"
          fi
          scripts/macos_app.sh "$version" gui/arm64/clouddirstat-gui gui/x86_64/clouddirstat-gui \
            "dist/CloudDirStat-${TAG:-dev}-macos.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos-app
          path: dist/*.dmg
          if-no-files-found: error

  publish:
    needs: [build, macos-app]
    if: github.event_name == 'release' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
