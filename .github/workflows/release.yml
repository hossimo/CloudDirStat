name: Release

# Publishing a GitHub release builds both programs for Windows and Linux, a universal
# macOS app (CloudDirStat.app in a DMG) and command line, and attaches them to it. Run it by hand to rebuild an existing release's assets
# (give its tag), or to test the build without a release (leave the tag empty).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach to (empty = build only)"
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: aarch64-apple-darwin, os: macos-latest }
          # Built on an older Ubuntu so the binaries also run on older glibc versions.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG || github.ref }}
          persist-credentials: false
          # Full history and tags, so the version comes from the release tag.
          fetch-depth: 0
      # Tags from before rust-toolchain.toml existed build with stable.
      - name: Read the Rust version
        shell: bash
        run: |
          version="$(grep -m1 '^channel' rust-toolchain.toml 2>/dev/null | cut -d '"' -f2)"
          echo "RUST_VERSION=${version:-stable}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}

      # Mac builds are not packaged here: the macos job turns the two into one universal
      # app and one universal command line.
      - name: Package
        if: ${{ !contains(matrix.target, 'apple-darwin') }}
        shell: bash
        run: |
          target="${{ matrix.target }}"
          name="clouddirstat-${TAG:-dev}-$target"
          ext=""
          if [[ "$target" == *windows* ]]; then ext=".exe"; fi

          mkdir -p "dist/$name"
          cp "target/$target/release/clouddirstat$ext" \
             "target/$target/release/clouddirstat-gui$ext" \
             README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"

          cd dist
          if [[ "$ext" == ".exe" ]]; then
            archive="$name.zip"
            pwsh -NoProfile -Command "Compress-Archive -Path '$name' -DestinationPath '$archive'"
          else
            archive="$name.tar.gz"
            tar -czf "$archive" "$name"
          fi
          rm -rf "$name"

      - if: ${{ !contains(matrix.target, 'apple-darwin') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

      # Only passed on to the macos job, so it doesn't need to be kept.
      - if: contains(matrix.target, 'apple-darwin')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/clouddirstat
            target/${{ matrix.target }}/release/clouddirstat-gui
          retention-days: 1
          if-no-files-found: error

  # Two Mac downloads: the app (universal CloudDirStat.app in a DMG) and the command
  # line (one universal binary in a tar.gz). Universal = runs natively on Apple
  # Silicon and Intel Macs, so nobody has to pick one.
  macos:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mac-aarch64-apple-darwin
          path: mac/arm64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mac-x86_64-apple-darwin
          path: mac/x86_64

      - name: Build the app and DMG
        run: |
          # The app's version is the tag without its "v", or Cargo's for test builds.
          version="${TAG#v}"
          if [[ -z "$version" ]]; then
            version="$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)"
          fi
          scripts/macos_app.sh "$version" mac/arm64/clouddirstat-gui mac/x86_64/clouddirstat-gui \
            "dist/CloudDirStat-${TAG:-dev}-macos.dmg"

      - name: Package the command line
        run: |
          name="clouddirstat-${TAG:-dev}-macos"
          mkdir -p "dist/$name"
          lipo -create -output "dist/$name/clouddirstat" \
            mac/arm64/clouddirstat mac/x86_64/clouddirstat
          # Artifacts lose the executable bit; joining the builds drops their signatures.
          chmod 755 "dist/$name/clouddirstat"
          codesign --force --sign - "dist/$name/clouddirstat"
          echo "architectures: $(lipo -archs "dist/$name/clouddirstat")"
          "dist/$name/clouddirstat" --version
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          rm -rf "dist/$name"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos
          path: |
            dist/*.dmg
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [build, macos]
    if: github.event_name == 'release' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For the build provenance attestations.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      # Signed proof that each file was built by this workflow from this repository;
      # check a download with `gh attestation verify FILE --repo hossimo/CloudDirStat`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      # Only a rebuild run by hand may replace files already attached to the release.
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          clobber=""
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then clobber="--clobber"; fi
          gh release upload "$TAG" dist/* $clobber --repo "$GITHUB_REPOSITORY"
