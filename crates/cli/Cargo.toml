[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clouddirstat-core = { path = "../core" }
clouddirstat-providers = { path = "../providers" }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync"] }
