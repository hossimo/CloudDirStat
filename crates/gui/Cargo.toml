[package]
name = "clouddirstat-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clouddirstat-core = { path = "../core" }
clouddirstat-providers = { path = "../providers" }
# glow (OpenGL) instead of the default wgpu renderer keeps the binary several MB smaller.
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "0.36.2", default-features = false }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "time"] }

[features]
# Scans made-up demo buckets instead of AWS, for screenshots. Never in release builds.
demo = ["clouddirstat-core/demo"]

# Build-time only: embeds icons/clouddirstat.ico into the Windows executable.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"
