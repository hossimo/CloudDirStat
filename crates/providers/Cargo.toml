[package]
name = "clouddirstat-providers"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aws-config = { version = "1.12.0", features = ["credentials-login"] }
aws-sdk-cloudwatch = "1.133.0"
aws-sdk-s3 = "1.150.0"
aws-lc-rs = "1.18.1"
base64 = "0.23.1"
clouddirstat-core = { path = "../core" }
dotenvy = "0.15"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "native-tokio", "tls12", "aws-lc-rs"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
percent-encoding = "2"
quick-xml = "0.41"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["macros", "sync", "rt", "time"] }
